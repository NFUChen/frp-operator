---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: tunnels.frp.aureum.cloud
spec:
  group: frp.aureum.cloud
  names:
    kind: Tunnel
    listKind: TunnelList
    plural: tunnels
    singular: tunnel
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Tunnel is the Schema for the tunnels API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TunnelSpec defines the desired state of Tunnel
            properties:
              exitServer:
                type: string
              http:
                description: HTTP exposes the tunnel as a vhost based HTTP proxy on
                  the exit server.
                properties:
                  customDomains:
                    items:
                      type: string
                    type: array
                  hostHeaderRewrite:
                    type: string
                  httpPassword:
                    type: string
                  httpUser:
                    type: string
                  localPort:
                    type: integer
                  locations:
                    items:
                      type: string
                    type: array
                  plugin:
                    description: Plugin configures an frpc client plugin instead of
                      a plain local address.
                    properties:
                      hostHeaderRewrite:
                        type: string
                      localPort:
                        type: integer
                      requestHeaders:
                        additionalProperties:
                          type: string
                        type: object
                      serviceRef:
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                      type:
                        enum:
                        - http2http
                        - http2https
                        type: string
                    required:
                    - localPort
                    - serviceRef
                    - type
                    type: object
                  requestHeaders:
                    additionalProperties:
                      type: string
                    type: object
                  responseHeaders:
                    additionalProperties:
                      type: string
                    type: object
                  routeByHTTPUser:
                    type: string
                  serviceRef:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  subdomain:
                    type: string
                type: object
                x-kubernetes-validations:
                - message: either plugin or both serviceRef and localPort must be
                    set
                  rule: has(self.plugin) != (has(self.serviceRef) && has(self.localPort))
                - message: at least one custom domain or a subdomain must be set
                  rule: size(self.customDomains) > 0 || has(self.subdomain)
              tcp:
                properties:
                  localPort:
                    type: integer
                  remotePort:
                    type: integer
                  serviceRef:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - localPort
                - remotePort
                - serviceRef
                type: object
              transport:
                properties:
                  bandwidthLimit:
                    pattern: ^\d+(KB|MB)$
                    type: string
                  bandwidthLimitMode:
                    enum:
                    - client
                    - server
                    type: string
                  proxyProtocol:
                    enum:
                    - v1
                    - v2
                    type: string
                  useCompression:
                    type: boolean
                  useEncryption:
                    type: boolean
                type: object
            required:
            - exitServer
            type: object
            x-kubernetes-validations:
            - message: exactly one of tcp or http must be set
              rule: has(self.tcp) != has(self.http)
          status:
            description: TunnelStatus defines the observed state of Tunnel
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
